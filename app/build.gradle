plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ROKID_RELEASE_KEYSTORE') ?:
        System.getProperty('user.home') + '/rokid-release.jks'
def releaseStorePassword = System.getenv('ROKID_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('ROKID_KEY_PASSWORD')

android {
    namespace 'io.github.ksuzukigh.phototomac'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ksuzukigh.phototomac'
        minSdk 32
        targetSdk 32
        versionCode 3
        versionName '0.3'
    }

    signingConfigs {
        release {
            storeFile file(releaseKeystorePath)
            storePassword releaseStorePassword
            keyAlias 'rokid'
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    lint {
        // Photo to Mac is sideloaded onto the RV101, not distributed through Google Play.
        disable 'ExpiredTargetSdkVersion'
    }
}
