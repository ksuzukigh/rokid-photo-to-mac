name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test Mac receiver
        run: python3 -m unittest discover -s tests

      - name: Build Android debug APK
        run: ./gradlew assembleDebug

      - name: Verify distributed APK version
        run: |
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)aapt"
          APK_CODE="$("$AAPT" dump badging Photo-to-Mac.apk \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          SRC_CODE="$(sed -n 's/.*versionCode *\([0-9]*\).*/\1/p' app/build.gradle)"
          echo "Distributed APK: $APK_CODE / Source: $SRC_CODE"
          test "$APK_CODE" = "$SRC_CODE"
